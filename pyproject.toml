[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rubber57sp-pretraindata_jd132"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rubber57sp" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rubber57sp.github.io"
Repository = "https://github.com/rubber57sp/pretraindata_jd132"
Issues = "https://github.com/rubber57sp/pretraindata_jd132/issues"

[project.scripts]
pretraindata_jd132 = "pretraindata_jd132:main"

[tool.setuptools]
py-modules = ["pretraindata_jd132"]
